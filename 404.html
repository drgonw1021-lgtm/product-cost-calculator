<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>页面不存在 · 产品成本核算工具</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
  :root {
    --ink: #08182A;
    --paper: #F5F9FE;
    --line: #DEE9F5;
    --muted: #5A6E84;
    --blue: #0A6BC4;
    --cyan: #5FD8F5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--paper);
    color: var(--ink);
    font: 400 16px/1.65 "MiSans", "HarmonyOS Sans SC", "PingFang SC",
          "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
    background-image:
      linear-gradient(to right, rgba(10, 107, 196, 0.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(10, 107, 196, 0.055) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .box {
    max-width: 520px;
    width: 100%;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 40px 36px;
    box-shadow: 0 20px 48px -28px rgba(8, 24, 42, 0.28);
  }
  .code {
    font: 700 64px/1 "SF Mono", "JetBrains Mono", Consolas, monospace;
    letter-spacing: -0.03em;
    color: var(--blue);
    margin: 0 0 6px;
  }
  h1 { font-size: 22px; margin: 0 0 10px; letter-spacing: -0.01em; }
  p { margin: 0 0 24px; color: var(--muted); font-size: 14.5px; }
  a.btn {
    display: inline-block;
    padding: 11px 22px;
    background: var(--blue);
    color: #fff;
    border-radius: 999px;
    text-decoration: none;
    font-size: 14.5px;
    font-weight: 600;
  }
  a.btn:hover { background: #095ba8; }
  a.plain {
    color: var(--blue);
    text-decoration: none;
    font-size: 14px;
    margin-left: 18px;
  }
  a.plain:hover { text-decoration: underline; }
  .mark {
    width: 15px; height: 15px;
    border: 2px solid var(--ink);
    border-radius: 4px;
    display: inline-block;
    position: relative;
    vertical-align: -2px;
    margin-right: 9px;
  }
  .mark::after {
    content: "";
    position: absolute;
    left: 2.5px; right: 2.5px; bottom: 2.5px;
    height: 2px;
    background: var(--cyan);
    border-radius: 1px;
  }
  .brand { font-size: 13.5px; color: var(--muted); margin-bottom: 26px; }
</style>
</head>
<body>
  <main class="box">
    <div class="brand"><span class="mark" aria-hidden="true"></span>产品成本核算工具</div>
    <p class="code">404</p>
    <h1>这个地址没有页面</h1>
    <p>可能是链接拼错了，或者这一页已经挪走。回首页可以看完整的成本构成与下载。</p>
    <a class="btn" href="/">回首页</a>
    <a class="plain" href="/web/">先试网页版</a>
  </main>
</body>
</html>
